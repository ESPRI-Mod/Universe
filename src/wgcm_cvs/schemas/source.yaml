imports:
  - linkml:types
  
id: http://es-vocab.ipsl.fr/sourceschema
name: source_schema


prefixes:
    esvocab: http://es-vocab.ipsl.fr/
    linkml: https://w3id.org/linkml/
    rdf: http://www.w3.org/1999/02/22-rdf-syntax-ns
    schema: http://schema.org/
    source:  http://es-vocab.ipsl.fr/source/
    

default_range: string  
default_prefix: source
default_curi_maps:
  - semweb_context
  
classes:
    Source:
        description: "a 'source' refers to a numerical representations of the Earth's climate system. They simulate the interactions between the atmosphere, oceans, land surface, and ice. These models are based on fundamental physical, chemical, and biological processes and are used to understand past, present, and future climate conditions. Each source or model is typically associated with a specific research institution, center, or group. For instance, models like 'EC-Earth' are developed by a consortium of European institutes, while 'GFDL-CM4' is developed by the Geophysical Fluid Dynamics Laboratory (GFDL) in the United States." 

        class_uri: esvocab:source
        attributes:
            id:
                slot_uri: source:id
                range: string
                required: true
                identifier: true

            validation_method :
                required: true
                range : string
                ifabsent: string(list)
                slot_uri: es-vocab:validation_method
                
            name:
                range: string
                required: true
            
            activity-participation:
                slot_uri: source:activity_participation
                range: string
                multivalued : true
                required : true

            cohort :
                slot_uri: source:cohort
                range: string
                required : true # ???

            institution_id:
                slot_uri: source:institution
                range : string
                required: true

            label_extended :
                slot_uri : source:label_extend
                range: string
                required : false

            license_info: 
                slot_uri : source:license_info
                range : license_info
                inlined : true
            model_component:
                slot_uri : source:model_component
                range: model_component
            release_year : 
                range : integer

                
                
    model_component:
        class_uri : source:model_component
        attributes : 
            aerosol: 
                range : model_component_info
            atmos: 
                range : model_component_info
            atmosChem :
                range : model_component_info
            land : 
                range : model_component_info
            ocean : 
                range : model_component_info
            seaIce : 
                range : model_component_info 


    model_component_info:
        class_uri : source:model_component_info
        attributes :
            description : 
                required: true
            version: 
                range : string
            native_nominal_resolution:
                range : string

    license_info:
        class_uri : source:license_info
        attributes:
            id : 
                required : true
                identifier: true
                range: string
            license : 
                required : true
                range : string
            url :
                range : string
            exceptions_contact: 
                range : string
            source_specific_info:
            range : string


                



