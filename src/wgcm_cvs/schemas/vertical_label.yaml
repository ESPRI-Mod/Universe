


id:  http://es-vocab.ipsl.fr/verticalLabelSchema
name: vertical_label_schema
title: vertical_label schema
license: https://creativecommons.org/publicdomain/zero/1.0/


prefixes:
    esvocab: http://es-vocab.ipsl.fr/
    
    realization: http://es-vocab.ipsl.fr/realization/
    linkml: https://w3id.org/linkml/
    rdf: http://www.w3.org/1999/02/22-rdf-syntax-ns
    schema: http://schema.org/
    verticallabel:  http://es-vocab.ipsl.fr/vertical_label/
    

# imports:
#   - linkml:types
default_range: string  
default_prefix: verticallabel
default_curi_maps:
  - semweb_context
  
classes:
    vertical_label:
        description : The verticalLabelDD indicates whether or not the data is a function of a vertical coordinate and if so, what type of coordinate it is and its length (when specified by a MIP's data request)
        class_uri: esvocab:vertical_label
        attributes:
            id: 
                range : string
                required: true
                identifier: true

            validation_method :
                required: true
                range : string
                ifabsent: string(regex)
            regex: 
                range: string
                required: true
                
            
            description: 
                range : string
                
types:
  string:
    uri: xsd:string
    base: str
    description: A character string
    notes: >-
      In RDF serializations, a slot with range of string is treated as a literal or type xsd:string.  
      If you are authoring schemas in LinkML YAML, the type is referenced with the lower case "string".
    exact_mappings:
      - schema:Text
